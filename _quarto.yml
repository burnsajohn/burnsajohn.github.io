  description: "Evolutionary cell biology and genomics of microbial eukaryotes. Burns Lab, Bigelow Laboratory for Ocean Sciences."
  site-url: https://www.protistsystems.org
  favicon: images/favicon.png
  navbar:
    title: "Protist Systems"
    left:
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: resources.qmd
        text: Resources
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: outreach.qmd
        text: Outreach
      - href: press.qmd
        text: Press
      - href: gallery.qmd
